<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>틈만 나면! : 배움의 빈틈 채우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2340; --navy-deep:#12172c; --paper:#FAF3E4; --paper-dim:#EFE6D2;
    --gold:#E8B34C; --coral:#E1667C; --teal:#4FB0A0; --ink:#232323; --crack:#F2E9D8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--navy); font-family:'Noto Sans KR',sans-serif; color:var(--paper); overflow-x:hidden;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
    background:radial-gradient(ellipse at top,#262f52 0%,var(--navy) 55%,var(--navy-deep) 100%);}
  .screen{flex:1;display:flex;flex-direction:column;padding:28px 22px 22px;animation:fadeIn .45s ease;min-height:100vh;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  h1.title{font-family:'Gaegu',sans-serif;font-weight:700;font-size:38px;line-height:1.25;color:var(--paper);margin:0 0 10px;}
  h1.title .accent{color:var(--coral);}
  p.sub{font-size:14.5px;line-height:1.7;color:#C9CDE0;margin:0 0 20px;}
  .crack-wrap{position:relative;height:150px;margin:8px 0 26px;display:flex;align-items:center;justify-content:center;}
  .crack-wrap svg{width:100%;height:100%;}
  .crack-line{fill:none;stroke:var(--crack);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(242,233,216,.35));stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s ease forwards .2s;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .crack-glow-l,.crack-glow-r{position:absolute;top:50%;width:64px;height:64px;border-radius:50%;transform:translateY(-50%);opacity:.55;filter:blur(18px);}
  .crack-glow-l{left:18%;background:var(--gold);} .crack-glow-r{right:18%;background:var(--coral);}
  .btn{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:16px;padding:16px 20px;border-radius:14px;border:none;
    cursor:pointer;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;
    transition:transform .12s ease;-webkit-appearance:none;}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-primary{background:var(--gold);color:var(--navy-deep);box-shadow:0 6px 0 #b3822f;justify-content:center;}
  .btn-primary:active{box-shadow:0 3px 0 #b3822f;}
  .btn-choice{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 #cbbf9e;margin-bottom:12px;font-size:14.5px;font-weight:500;}
  .btn-choice:active{box-shadow:0 2px 0 #cbbf9e;}
  .btn-choice .num{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--coral);margin-right:8px;}
  .btn-row{margin-top:auto;padding-top:18px;}
  input.textfield{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:20px;font-weight:700;padding:16px 14px;
    border-radius:12px;border:2px solid rgba(250,243,228,.25);background:rgba(250,243,228,.06);color:var(--paper);margin-bottom:18px;}
  input.textfield::placeholder{color:rgba(250,243,228,.35);font-weight:400;}
  input.textfield:focus{outline:none;border-color:var(--gold);}
  .gender-row{display:flex;gap:12px;margin-bottom:8px;}
  .gender-btn{flex:1;padding:22px 0;border-radius:14px;border:2px solid rgba(250,243,228,.25);
    background:rgba(250,243,228,.06);color:var(--paper);font-size:17px;font-weight:700;cursor:pointer;}
  .gender-btn.selected{border-color:var(--teal);background:rgba(79,176,160,.22);color:#fff;}
  .card{background:rgba(250,243,228,.07);border:1.5px solid rgba(250,243,228,.16);border-radius:16px;
    padding:14px;margin-bottom:14px;cursor:pointer;display:flex;gap:14px;align-items:center;}
  .card:active{background:rgba(250,243,228,.14);}
  .card-thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;background:rgba(250,243,228,.1);
    position:relative;}
  .card-thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top center;}
  .card-body{flex:1;min-width:0;}
  .card .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--teal);text-transform:uppercase;}
  .card h3{font-family:'Gaegu',sans-serif;font-size:23px;margin:2px 0 4px;color:var(--paper);}
  .card p{font-size:12.5px;line-height:1.5;color:#C9CDE0;margin:0;}
  .gauge-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .gauge-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--gold);white-space:nowrap;}
  .gauge-track{position:relative;flex:1;height:9px;border-radius:6px;background:rgba(250,243,228,.14);overflow:hidden;}
  .gauge-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coral),var(--gold),var(--teal));transition:width .5s ease;}
  .gauge-crack{position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,transparent 0 6px,rgba(18,23,44,.55) 6px 8px);transition:opacity .5s ease;}
  .scene-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin-bottom:10px;}

  /* ---- VN stage ---- */
  .vn-wrap{flex:1;display:flex;flex-direction:column;padding:20px 16px 16px;min-height:100vh;}
  .stage{position:relative;flex:1;min-height:300px;border-radius:20px;overflow:hidden;margin-bottom:14px;
    box-shadow:inset 0 0 0 1.5px rgba(250,243,228,.12);}
  .stage-bg{position:absolute;inset:0;}
  .stage-bg{position:absolute;inset:0;overflow:hidden;}
  .stage-bg img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  .stage-bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(18,23,44,.18) 0%, rgba(18,23,44,.02) 40%, rgba(18,23,44,.55) 78%, rgba(18,23,44,.85) 100%);}
  .stage-bg.bg-exam img{filter:saturate(.7) brightness(.82) hue-rotate(-6deg);}
  .stage-char{position:absolute;bottom:126px;left:50%;transform:translateX(-50%);
    max-height:calc(100% - 138px);max-width:82%;width:auto;height:auto;
    object-fit:contain;object-position:bottom;filter:drop-shadow(0 12px 20px rgba(0,0,0,.4));
    animation:charIn .35s ease;}
  .stage.choice-mode .stage-char{bottom:236px;max-height:calc(100% - 248px);}
  @keyframes charIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  .stage-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Gaegu',sans-serif;font-size:22px;color:rgba(250,243,228,.35);text-align:center;padding:20px;}

  .textbox{background:var(--paper);border-radius:16px;padding:16px 18px;min-height:96px;position:relative;cursor:pointer;}
  .textbox .speaker{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;
    letter-spacing:.05em;color:#fff;background:var(--coral);padding:4px 10px;border-radius:20px;margin-bottom:8px;}
  .textbox .speaker.me{background:var(--teal);}
  .textbox .speaker.narr{background:#8b90ab;}
  .textbox .line{font-size:15px;line-height:1.7;color:var(--ink);}
  .textbox .tapicon{position:absolute;bottom:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--coral);animation:bob 1.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
  .choices{}
  .advance-row{margin-top:2px;}

  .ending-hero{width:100%;border-radius:18px;overflow:hidden;margin-bottom:16px;position:relative;}
  .ending-hero img{width:100%;display:block;}
  .ending-hero-none{width:100%;height:140px;border-radius:18px;margin-bottom:16px;
    background:linear-gradient(135deg,#262f52,#1B2340);display:flex;align-items:center;justify-content:center;
    font-family:'Gaegu',sans-serif;font-size:20px;color:rgba(250,243,228,.4);}
  .ending-badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    padding:6px 12px;border-radius:20px;margin-bottom:12px;display:inline-block;}
  .ending-happy{background:rgba(232,179,76,.2);color:var(--gold);border:1px solid var(--gold);}
  .ending-normal{background:rgba(79,176,160,.2);color:var(--teal);border:1px solid var(--teal);}
  .ending-bad{background:rgba(225,102,124,.2);color:var(--coral);border:1px solid var(--coral);}
  .ending-title{font-family:'Gaegu',sans-serif;font-size:28px;margin:0 0 12px;}
  .ending-text{font-size:14.5px;line-height:1.85;color:#EAE6D6;margin-bottom:20px;}
  .cta-box{background:rgba(232,179,76,.1);border:1.5px dashed rgba(232,179,76,.5);border-radius:14px;padding:16px;
    font-size:13.5px;line-height:1.7;color:var(--gold);margin-bottom:18px;}
  .footer-credit{text-align:center;font-size:11px;color:rgba(250,243,228,.3);margin-top:16px;font-family:'JetBrains Mono',monospace;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;}}

  /* ---- title cover ---- */
  .title-screen{padding:0;position:relative;min-height:100vh;overflow:hidden;cursor:pointer;background:#000;}
  .title-bg-blur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:blur(22px) brightness(.5) saturate(1.05);transform:scale(1.18);}
  .title-bg-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;}
  .title-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(18,23,44,0) 78%, rgba(18,23,44,.45) 92%, rgba(18,23,44,.7) 100%);}
  .title-tap{position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:2;}
  .title-tap span{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;color:#fff;
    padding:10px 22px;border:1.5px solid rgba(255,255,255,.7);border-radius:30px;background:rgba(18,23,44,.35);
    animation:pulseTap 1.6s ease-in-out infinite;}
  @keyframes pulseTap{0%,100%{opacity:.75;}50%{opacity:1;}}

  /* ---- toast (affection change) ---- */
  .affect-toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;padding:12px 26px;border-radius:26px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    animation:toastPop 2.1s ease forwards; pointer-events:none; white-space:nowrap;}
  .affect-up{background:rgba(232,179,76,.96);color:var(--navy-deep);}
  .affect-down{background:rgba(225,102,124,.96);color:#fff;}
  .affect-flat{background:rgba(255,255,255,.92);color:var(--navy-deep);}
  @keyframes toastPop{
    0%{opacity:0; transform:translateX(-50%) translateY(-10px) scale(.85);}
    10%{opacity:1; transform:translateX(-50%) translateY(0) scale(1.08);}
    18%{transform:translateX(-50%) translateY(0) scale(1);}
    82%{opacity:1;}
    100%{opacity:0; transform:translateX(-50%) translateY(-8px) scale(.96);}
  }

  /* ---- VN dialogue overlay (replaces floating paper card) ---- */
  .stage{display:flex;}
  .vn-textbox{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;
    background:linear-gradient(180deg, rgba(18,23,44,.55), rgba(18,23,44,.86));
    backdrop-filter:blur(3px);
    border:1px solid rgba(250,243,228,.18);
    border-radius:14px; padding:14px 16px 16px; cursor:pointer;}
  .vn-textbox .speaker{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;
    letter-spacing:.05em;color:#fff;background:var(--coral);padding:4px 10px;border-radius:20px;margin-bottom:8px;}
  .vn-textbox .speaker.me{background:var(--teal);}
  .vn-textbox .speaker.narr{background:#6d7391;}
  .vn-textbox .line{font-size:14.5px;line-height:1.65;color:#FBF6EA;}
  .vn-textbox .tapicon{position:absolute;bottom:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--gold);animation:bob 1.2s ease-in-out infinite;}
  .vn-choices{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;}
  .vn-advance{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;}
</style>
</head>

    background:rgba(18,23,44,.55); backdrop-filter:blur(4px);
    color:#FAF3E4; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .sound-toggle:active{transform:scale(.94);}
</style>

    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.screen){ S = parsed; return true; } }
  }catch(e){ /* storage unavailable, ignore */ }
  return false;
}
function clearState(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---- sound: short synthesized tick + bgm control ---- */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function unlockAudioOnce(){
  const ctx = ensureAudioCtx();
  if(ctx && ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  // iOS Safari sometimes needs an actual silent buffer played on the first gesture
  if(ctx){
    try{
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start(0);
    }catch(e){}
  }
}
['pointerdown','touchstart','click'].forEach(evt=>{
  document.addEventListener(evt, unlockAudioOnce, {once:true, passive:true});
});
function playTick(){
  if(!S.sfxOn) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(720, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + 0.06);
}
function playNote(ctx, freq, start, dur, vol, type){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'triangle';
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(start); osc.stop(start + dur + 0.02);
}
function playAffect(delta){
  if(!S.sfxOn) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  const t0 = ctx.currentTime + 0.02;
  if(delta > 0){
    // cheerful ascending major arpeggio: C5 E5 G5 C6
    playNote(ctx, 523.25, t0,        0.14, 0.16, 'triangle');
    playNote(ctx, 659.25, t0 + 0.09, 0.14, 0.16, 'triangle');
    playNote(ctx, 783.99, t0 + 0.18, 0.14, 0.16, 'triangle');
    playNote(ctx, 1046.5, t0 + 0.27, 0.22, 0.18, 'triangle');
  } else if(delta < 0){
    // wistful descending minor: E5 -> C5 -> A4 (slower, softer)
    playNote(ctx, 659.25, t0,        0.22, 0.14, 'sine');
    playNote(ctx, 523.25, t0 + 0.16, 0.22, 0.13, 'sine');
    playNote(ctx, 440.00, t0 + 0.34, 0.34, 0.12, 'sine');
  } else {
    // neutral: soft single mid blip
    playNote(ctx, 587.33, t0, 0.16, 0.10, 'sine');
  }
}
let lastTypeBlip = 0;
function playTypeBlip(){
  if(!S.sfxOn) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  const now = ctx.currentTime;
  if(now - lastTypeBlip < 0.045) return; // throttle
  lastTypeBlip = now;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  // slight random pitch variation for a natural typing feel
  osc.frequency.setValueAtTime(1250 + Math.random()*250, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.035, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.035);
}
function playEnding(kind){
  if(!S.sfxOn) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  const t0 = ctx.currentTime + 0.05;
  if(kind === 'happy'){
    // bright fanfare: C5 E5 G5 -> C6 chord swell
    playNote(ctx, 523.25, t0,        0.18, 0.15, 'triangle');
    playNote(ctx, 659.25, t0 + 0.12, 0.18, 0.15, 'triangle');
    playNote(ctx, 783.99, t0 + 0.24, 0.18, 0.15, 'triangle');
    playNote(ctx, 1046.5, t0 + 0.40, 0.55, 0.17, 'triangle');
    playNote(ctx, 1318.5, t0 + 0.40, 0.55, 0.10, 'sine');
    playNote(ctx, 1568.0, t0 + 0.40, 0.55, 0.07, 'sine');
  } else if(kind === 'bad'){
    // somber low descending minor with slow decay: A4 -> F4 -> D4
    playNote(ctx, 440.00, t0,        0.5, 0.13, 'sine');
    playNote(ctx, 349.23, t0 + 0.38, 0.5, 0.12, 'sine');
    playNote(ctx, 293.66, t0 + 0.78, 0.9, 0.12, 'sine');
    playNote(ctx, 146.83, t0 + 0.78, 0.9, 0.06, 'sine');
  } else {
    // normal: gentle warm two-note resolve G4 -> C5
    playNote(ctx, 392.00, t0,        0.28, 0.12, 'sine');
    playNote(ctx, 523.25, t0 + 0.22, 0.5, 0.13, 'triangle');
  }
}
function updateSoundUI(){
  const btn = document.getElementById('soundToggle');
  if(btn) btn.textContent = S.sfxOn ? '🔊' : '🔇';
  const bgm = document.getElementById('bgm');
  if(bgm){
    if(S.sfxOn && bgm.src){ bgm.play().catch(()=>{}); }
    else { bgm.pause(); }
  }
}
document.getElementById('soundToggle').onclick = ()=>{
  S.sfxOn = !S.sfxOn;
  updateSoundUI();
  saveState();
};

}

function screenName(){
  app.innerHTML = `
  <div class="screen">
    <div class="eyebrow">STEP 1</div>
    <h1 class="title" style="font-size:28px;">이름을 입력해주세요!</h1>
    <input class="textfield" id="nameInput" placeholder="예) 지유" maxlength="8" value="${S.name || ''}" autofocus>
    <div class="btn-row"><button class="btn btn-primary" id="next">다음</button></div>
  </div>`;
  const inp = document.getElementById('nameInput');
  document.getElementById('next').onclick = ()=>{
    S.name = inp.value.trim() || '지유';
    S.screen='gender'; render();
  };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ document.getElementById('next').click(); }});
}

function screenGender(){
  app.innerHTML = `
  <div class="screen">
    <div class="eyebrow">STEP 2</div>
    <h1 class="title" style="font-size:28px;">성별을 선택해주세요</h1>
    <p class="sub">${S.name}님과 다른 성별의 캐릭터가 등장해요.</p>
    <div class="gender-row">
      <button class="gender-btn" data-g="남">남</button>
      <button class="gender-btn" data-g="여">여</button>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="next" disabled style="opacity:.4">다음</button></div>
  </div>`;
  const btns = [...document.querySelectorAll('.gender-btn')];
  const nextBtn = document.getElementById('next');
  btns.forEach(b=>{
    b.onclick = ()=>{
      btns.forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      S.gender = b.dataset.g;
      nextBtn.disabled = false; nextBtn.style.opacity = 1;
    };
  });
  nextBtn.onclick = ()=>{ if(S.gender){ S.screen='select'; render(); } };
}

function screenSelect(){
  const cards = Object.values(ROUTES).map(r => {
    const thumb = imgFor(r.key, 'neutral');
    return `
    <div class="card" data-k="${r.key}">
      <div class="card-thumb">${thumb ? `<img src="${thumb}">` : ''}</div>
      <div class="card-body">
        <div class="tag">${r.key} · ${r.tag}</div>
        <h3>${r.name}</h3>
        <p>${r.teaser}</p>
      </div>
    </div>`;
  }).join('');
  app.innerHTML = `
  <div class="screen">
    <div class="eyebrow">STEP 3</div>
    <h1 class="title" style="font-size:26px;">한 명의 캐릭터를<br>선택해주세요</h1>
    <p class="sub">각자 다른 이유로 배움에서 멀어진 친구들이에요.</p>
    ${cards}
  </div>`;
  document.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{
      S.route = c.dataset.k;
      S.sceneIdx = 0; S.score = 0; S.lineIdx = 0; S.phase='lines'; S.respLineIdx=0;
      S.screen='routeIntro'; render();
    };
  });
}

function screenRouteIntro(){
  const r = ROUTES[S.route];
  const thumb = imgFor(r.key, 'neutral');
  app.innerHTML = `
  <div class="screen">
    <div class="scene-tag">${r.tag} · ${r.name}의 이야기</div>
    ${thumb ? `<div class="card-thumb" style="width:100%;height:220px;border-radius:16px;margin-bottom:16px;"><img src="${thumb}" style="object-position:top;"></div>` : ''}
    <p class="sub" style="font-size:15.5px; color:#EAE6D6;">${fill(r.intro)}</p>
    <div class="btn-row"><button class="btn btn-primary" id="go">이야기 시작</button></div>
  </div>`;
  document.getElementById('go').onclick = ()=>{ S.screen='scene'; render(); };
}

function screenScene(){
  const r = ROUTES[S.route];
  const scene = r.scenes[S.sceneIdx];
  const isLastScene = S.sceneIdx === r.scenes.length - 1;

  // determine which line/response is currently shown + running mood
  let currentLine = null, mood = 'neutral', speakerCls='narr', speakerLabel='내레이션';
  let bodyBlock = '';

  if(S.phase === 'lines'){
    currentLine = scene.lines[S.lineIdx];
  } else if(S.phase === 'choice'){
    currentLine = null;
  } else if(S.phase === 'response'){
    currentLine = scene.choices[S.chosenIdx].response[S.respLineIdx];
  }

  // compute mood: walk backwards through lines shown so far to find last mood
  function computeMood(){
    let m = 'neutral';
    const upto = S.phase === 'lines' ? S.lineIdx : scene.lines.length;
    for(let i=0;i<upto;i++){ if(scene.lines[i].mood) m = scene.lines[i].mood; }
    if(S.phase === 'response'){
      const resp = scene.choices[S.chosenIdx].response;
      for(let i=0;i<=S.respLineIdx;i++){ if(resp[i] && resp[i].mood) m = resp[i].mood; }
    }
    return m;
  }
  mood = computeMood();

  if(currentLine){
    if(currentLine.t === 'narr'){ speakerCls='narr'; speakerLabel='내레이션'; }
    else if(currentLine.t === 'me'){ speakerCls='me'; speakerLabel=S.name || '나'; }
    else { speakerCls='char'; speakerLabel=r.name; }
  }

  const charImg = r.hasImages ? imgFor(r.key, mood) : null;
  const bgClass = 'bg-' + (scene.bg || 'classroom');

  let box = '';
  if(S.phase === 'choice'){
    box = `<div class="vn-choices">` + scene.choices.map((c,i)=>`
      <button class="btn btn-choice" data-i="${i}"><span><span class="num">${i+1}</span>${fill(c.text)}</span></button>
    `).join('') + `</div>`;
  } else if(S.phase === 'nextup'){
    box = `<div class="vn-advance"><button class="btn btn-primary" id="advance">${isLastScene ? '결과 확인하기' : '다음 장면으로'}</button></div>`;
  } else {
    box = `
    <div class="vn-textbox" id="tap">

      ${toastHTML}
      ${box}
    </div>
  </div>`;

  if(S.phase === 'lines' || S.phase === 'response'){
    // typewriter effect
    const fullText = fill(currentLine.s);
    const lineEl = document.getElementById('vnLine');
    const tapEl = document.getElementById('tap');
    let ti = 0, done = false, timer = null;
    lineEl.textContent = '';
    function finishType(){
      done = true;
      if(timer) clearInterval(timer);
      lineEl.textContent = fullText;
    }
    timer = setInterval(()=>{
      ti += 2; // 2 chars per tick = fast typing
      if(ti >= fullText.length){ finishType(); }
      else { lineEl.textContent = fullText.slice(0, ti); playTypeBlip(); }
    }, 24);
    tapEl.onclick = ()=>{
      if(!done){ finishType(); return; }  // first tap completes the line
      playTick();
      if(timer) clearInterval(timer);
      if(S.phase === 'lines'){
        if(S.lineIdx < scene.lines.length - 1){ S.lineIdx++; }
        else { S.phase = 'choice'; }
      } else if(S.phase === 'response'){
        const resp = scene.choices[S.chosenIdx].response;
        if(S.respLineIdx < resp.length - 1){ S.respLineIdx++; }
        else { S.phase = 'nextup'; }
      }
      render();
    };
  }
  document.querySelectorAll('.btn-choice').forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.i,10);
      S.chosenIdx = i; S.score += scene.choices[i].pts;
      S.lastDelta = scene.choices[i].pts;
      playAffect(S.lastDelta);
      S.phase = 'response'; S.respLineIdx = 0;
      render();
    };
  });
  const adv = document.getElementById('advance');
  if(adv){
    adv.onclick = ()=>{
      playTick();
      if(isLastScene){ S.screen = 'ending'; }
      else { S.sceneIdx++; S.lineIdx=0; S.phase='lines'; S.respLineIdx=0; }
      render();
    };
  }
}

function screenEnding(){
  const r = ROUTES[S.route];
  let key, cls;
  if(S.score >= 6){ key='happy'; cls='ending-happy'; }
  else if(S.score >= 2){ key='normal'; cls='ending-normal'; }
  else { key='bad'; cls='ending-bad'; }
  const e = r.endings[key];

  if(!S.endingPlayed){
    S.endingPlayed = true;
    playEnding(key);
  }

  let heroImg = null;
  if(r.hasImages){
    if(key === 'happy') heroImg = imgFor(r.key, 'endingHappy');
    else if(key === 'bad') heroImg = imgFor(r.key, 'endingBad');
    else heroImg = imgFor(r.key, 'neutral');
  }

  app.innerHTML = `
  <div class="screen">
    <div class="eyebrow">${r.tag} · ${r.name}의 이야기 — 결과</div>
    ${gaugeHTML()}
    ${heroImg ? `<div class="ending-hero"><img src="${heroImg}"></div>` : `<div class="ending-hero-none">${r.name}<br><span style="font-size:13px;opacity:.7;">(이미지 준비 중)</span></div>`}
    <div class="ending-badge ${cls}">${key.toUpperCase()} ENDING</div>
    <h1 class="ending-title">${e.title}</h1>
    <p class="ending-text">${fill(e.text)}</p>
    <div class="cta-box">🖊️ 엔딩을 확인했다면, 옆 부스로 이동해서 나만의 학습 부적(모나미 볼펜)을 만들어보세요!</div>
    <div class="btn-row"><button class="btn btn-primary" id="retry">처음부터 다시 하기</button></div>
    <div class="footer-credit">SDG10 · 교육 격차 완화 부스</div>
  </div>`;
  document.getElementById('retry').onclick = ()=>{ clearState(); resetAll(); render(); };
}

/* =========================================================
   ROUTER
========================================================= */
function render(){
  switch(S.screen){
    case 'title': screenTitle(); break;
    case 'name': screenName(); break;
    case 'gender': screenGender(); break;
    case 'select': screenSelect(); break;
    case 'routeIntro': screenRouteIntro(); break;
    case 'scene': screenScene(); break;
    case 'ending': screenEnding(); break;
  }
  updateSoundUI();
  saveState();
}
if(!loadState()){ resetAll(); }
render();
</script>
